<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Templates · Dovecote</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body class="">
  <header id="nav"></header>
  <main class="container narrow">
    <div class="page-head"><h1>Templates</h1></div>
    <form id="tpl-form" class="card" novalidate>
      <h3 id="form-title">New template</h3>
      <div class="form-row">
        <label>Name
          <input name="name" required placeholder="Welcome message" />
        </label>
        <label>Channel
          <select name="channel">
            <option value="email">Email</option><option value="sms">SMS</option><option value="in_app">In-app</option>
          </select>
        </label>
      </div>
      <label>Subject
        <input name="subject" placeholder="Welcome, {{name}}" />
      </label>
      <label>Message
        <textarea name="body" required placeholder="Hi {{name}}, your code is {{code}}."></textarea>
        <span class="hint">Put variables in double curly braces, like {{name}}. You fill them in when you send.</span>
      </label>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit" id="save">Save template</button>
        <button class="btn" type="button" id="reset" hidden>Cancel edit</button>
      </div>
    </form>
    <div id="list" class="tpl-grid"></div>
  </main>
  <script type="module" src="js/pages/templates.js"></script>
</body>
</html>
