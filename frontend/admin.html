<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin · Dovecote</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body class="">
  <header id="nav"></header>
  <main class="container">
    <div class="page-head">
      <h1>Admin</h1>
      <a class="btn" href="notifications.html">All notifications</a>
    </div>

    <div class="stats" id="stats"></div>

    <div class="section-head"><h2>Failed queue</h2><span class="muted small">Retrying gives a notification 3 more attempts.</span></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Recipient</th><th>Channel</th><th>Last error</th><th>Attempts</th><th></th></tr></thead>
        <tbody id="failed"></tbody>
      </table>
    </div>

    <div class="section-head"><h2>Users</h2></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead>
        <tbody id="users"></tbody>
      </table>
    </div>
  </main>
  <script type="module" src="js/pages/admin.js"></script>
</body>
</html>
